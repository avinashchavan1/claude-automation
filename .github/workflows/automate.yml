name: Claude Automation

on:
  schedule:
    # Every 4 hours (at minute 0). Times are UTC.
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write # needed to open an issue when the session expires

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore Claude session from secret
        env:
          CLAUDE_AUTH: ${{ secrets.CLAUDE_AUTH }}
        run: |
          if [ -z "$CLAUDE_AUTH" ]; then
            echo "CLAUDE_AUTH secret is empty. Run login.js locally and add it." >&2
            exit 1
          fi
          echo "$CLAUDE_AUTH" | base64 -d > auth.json

      - name: Run automation script
        run: node index.js

      - name: Upload screenshot artifact
        if: always() # upload even if the script failed, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Notify on expired session
        # Runs only if the script left the expiry marker. Opens a GitHub issue
        # (GitHub emails you since you own the repo). Reuses one open issue
        # instead of spamming a new one every 4 hours.
        if: always() && hashFiles('session-expired.flag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="⚠️ Claude session expired — action needed"
          BODY=$(printf '%s\n' \
            "The automation could not log in: the saved Claude session expired." \
            "" \
            "**Fix:** run \`node login.js\` locally, then update the secret:" \
            "\`\`\`" \
            "base64 -i auth.json | gh secret set CLAUDE_AUTH --repo $REPO" \
            "\`\`\`" \
            "" \
            "Failing run: $RUN_URL")
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title $TITLE" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
